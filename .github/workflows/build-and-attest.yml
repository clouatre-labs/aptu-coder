# SLSA v1.0 Build Level 3: this workflow is a reusable workflow (workflow_call).
# The reusable workflow boundary isolates the build and attestation steps from the
# caller, satisfying the Level 3 isolation requirement per GitHub's documentation:
# https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3
name: Build and Attest

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Rust target triple (e.g., x86_64-unknown-linux-musl)"
      os:
        required: true
        type: string
        description: "Runner OS (ubuntu-24.04, macos-15)"
      cross:
        required: true
        type: boolean
        description: "Use cross-compilation toolchain"
      version:
        required: true
        type: string
        description: "Release version tag"
      dry_run:
        required: false
        type: boolean
        default: false
        description: "Dry run (skip uploads and signatures)"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-attest:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: "1.97.1"
          targets: ${{ inputs.target }}

      - name: Setup cross-compilation toolchain
        if: ${{ inputs.cross }}
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        with:
          target: ${{ inputs.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: aptu-coder
          key: ${{ inputs.target }}

      - name: Upload Rust binary
        if: ${{ !inputs.dry_run }}
        id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: aptu-coder
          target: ${{ inputs.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
          archive: aptu-coder-${{ inputs.version }}-${{ inputs.target }}
          ref: refs/tags/v${{ inputs.version }}

      - name: Build binary (dry-run)
        if: ${{ inputs.dry_run }}
        env:
          TARGET: ${{ inputs.target }}
        run: cargo build --locked --release --target "${TARGET}"

      - name: Sign tarball with cosign
        if: ${{ !inputs.dry_run }}
        run: cosign sign-blob --yes --bundle "${{ steps.upload.outputs.tar }}.bundle" "${{ steps.upload.outputs.tar }}"

      - name: Upload bundle to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v${VERSION}" "${{ steps.upload.outputs.tar }}.bundle" --clobber

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.upload.outputs.tar }}

# SLSA v1.0 Build Level 3: this workflow is a reusable workflow (workflow_call).
# The reusable workflow boundary isolates the build and attestation steps from the
# caller, satisfying the Level 3 isolation requirement per GitHub's documentation:
# https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3
name: Build and Attest

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Rust target triple (e.g., x86_64-unknown-linux-musl)"
      os:
        required: true
        type: string
        description: "Runner OS (ubuntu-26.04, macos-15)"
      cross:
        required: true
        type: boolean
        description: "Use cross-compilation toolchain"
      version:
        required: true
        type: string
        description: "Release version tag"
      release_id:
        required: true
        type: string
        description: "GitHub Release (draft) ID to upload assets to"
      dry_run:
        required: false
        type: boolean
        default: false
        description: "Dry run (skip uploads and signatures)"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-attest:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"
          targets: ${{ inputs.target }}

      - name: Setup cross-compilation toolchain
        if: ${{ inputs.cross }}
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        with:
          target: ${{ inputs.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: aptu-coder
          key: ${{ inputs.target }}

      - name: Build binary
        env:
          TARGET: ${{ inputs.target }}
        run: cargo build --locked --release --target "${TARGET}"

      - name: Archive binary and checksum
        if: ${{ !inputs.dry_run }}
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="aptu-coder-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/aptu-coder" staging/aptu-coder
          tar -czf "${ARCHIVE}" -C staging aptu-coder
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Sign tarball with cosign
        if: ${{ !inputs.dry_run }}
        env:
          ARCHIVE: ${{ env.ARCHIVE }}
        run: cosign sign-blob --yes --bundle "${ARCHIVE}.bundle" "${ARCHIVE}"

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload assets to draft release
        # Immutable releases (owner-enforced) lock assets at publish time, so
        # assets are uploaded to the draft release via the assets API; the
        # publish-release job flips draft=false only after all uploads complete.
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          ARCHIVE: ${{ env.ARCHIVE }}
        run: |
          set -euo pipefail
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.upload_url' | sed 's/{.*}//')
          for file in "${ARCHIVE}" "${ARCHIVE}.sha256" "${ARCHIVE}.bundle"; do
            name=$(basename "${file}")
            ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"${name}\") | .id")
            if [ -n "${ASSET_ID}" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
            fi
            gh api --method POST "${UPLOAD_URL}?name=${name}" \
              --input "${file}" \
              -H "Content-Type: application/octet-stream" > /dev/null
            echo "Uploaded ${name}"
          done

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish, release creation, homebrew)'
        required: true
        type: boolean
        default: true
      version:
        description: 'Version to simulate (e.g., 0.1.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
  DISPATCH_VERSION: ${{ inputs.version }}

jobs:
  verify-tag-signature:
    name: Verify Tag Signature
    runs-on: ubuntu-26.04-arm
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Verifying signature for tag: $TAG"

          # Get tag ref to find the tag object SHA
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq '.object.sha')
          TAG_TYPE=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq '.object.type')

          if [ "$TAG_TYPE" != "tag" ]; then
            echo "ERROR: $TAG is a lightweight tag (type: $TAG_TYPE), not an annotated/signed tag"
            exit 1
          fi

          # Verify the tag signature via GitHub API
          VERIFIED=$(gh api "repos/${{ github.repository }}/git/tags/$TAG_SHA" --jq '.verification.verified')
          REASON=$(gh api "repos/${{ github.repository }}/git/tags/$TAG_SHA" --jq '.verification.reason')

          echo "Tag verification: verified=$VERIFIED, reason=$REASON"

          if [ "$VERIFIED" != "true" ]; then
            echo "ERROR: Tag $TAG signature is not valid (reason: $REASON)"
            exit 1
          fi

          echo "Tag $TAG is signed and verified by GitHub"

  create-release:
    name: Create Release
    needs: [verify-tag-signature]
    if: always() && (needs.verify-tag-signature.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from tag or input
        id: extract_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version matches Cargo.toml
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version $VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Create GitHub draft release
        # Immutable releases (owner-enforced) lock assets and the tag at publish
        # time, so the release is created as a draft first; assets are uploaded
        # to the draft by build-and-attest and generate-mcpb, and publish-release
        # flips draft=false only after every asset is uploaded.
        if: ${{ env.DRY_RUN != 'true' }}
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          # Idempotent: reuse an existing draft or published release for this tag
          # (workflow re-runs); otherwise create a new draft release targeting
          # the signed tag. A published release is immutable (owner-enforced),
          # so downstream mutating steps no-op on it.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | select(.draft) | .id" | head -n1 || true)
          if [ -z "${RELEASE_ID}" ]; then
            RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id" | head -n1 || true)
          fi
          if [ -z "${RELEASE_ID}" ]; then
            RELEASE_ID=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -F tag_name="v${VERSION}" \
              -F draft=true \
              -F name="v${VERSION}" \
              -F generate_release_notes=true \
              --jq '.id')
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "Draft release id: ${RELEASE_ID}"

      - name: Dry run - skip release creation
        if: ${{ env.DRY_RUN == 'true' }}
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: echo "DRY RUN - Would create release for v$VERSION"

  build-and-attest:
    name: Build ${{ matrix.target }}
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04
            cross: true
          - target: aarch64-apple-darwin
            os: macos-15
            cross: false
    uses: ./.github/workflows/build-and-attest.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      cross: ${{ matrix.cross }}
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

  generate-mcpb:
    name: Generate MCPB Bundles
    needs: [create-release, build-and-attest]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate and upload MCPB bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.create-release.outputs.version }}"

          declare -a targets=("aarch64-apple-darwin" "aarch64-unknown-linux-musl" "x86_64-unknown-linux-musl")

          # Re-run guard: a published release is immutable (owner-enforced); its
          # assets are already locked and must not be mutated. The MCPB bundles
          # needed by publish-registry are already on the release.
          IS_DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')
          if [ "${IS_DRAFT}" != "true" ]; then
            echo "Release already published and immutable; skipping MCPB generation"
            exit 0
          fi

          for target in "${targets[@]}"; do
            echo "Processing target: $target"

            ARTIFACT_NAME="aptu-coder-${VERSION}-${target}.tar.gz"

            # Download tarball from the draft release via the assets API (draft
            # releases are not resolvable by tag).
            ASSET_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"${ARTIFACT_NAME}\") | .url")
            if [ -z "${ASSET_URL}" ]; then
              echo "Error: asset ${ARTIFACT_NAME} not found on draft release" >&2
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" "${ASSET_URL}" > "/tmp/${ARTIFACT_NAME}"

            # Validate the downloaded tarball before extracting
            if ! tar -tzf "/tmp/${ARTIFACT_NAME}" >/dev/null 2>&1; then
              echo "Error: Downloaded file /tmp/${ARTIFACT_NAME} is not a valid tar.gz archive" >&2
              exit 1
            fi

            # Extract the binary
            mkdir -p "/tmp/mcpb-${target}"
            tar -xzf "/tmp/${ARTIFACT_NAME}" -C "/tmp/mcpb-${target}"

            # Create manifest.json
            printf '%s\n' \
              '{' \
              '  "name": "aptu-coder",' \
              "  \"version\": \"${VERSION}\"," \
              '  "description": "MCP server for code structure analysis using tree-sitter",' \
              '  "args": []' \
              '}' > "/tmp/mcpb-${target}/manifest.json"

            # Create the .mcpb zip file
            MCPB_NAME="aptu-coder-${VERSION}-${target}.mcpb"
            cd "/tmp/mcpb-${target}"
            zip -r "/tmp/${MCPB_NAME}" aptu-coder manifest.json
            cd -

            # Upload to the draft release via the assets API (immutable releases
            # lock assets at publish; publish-release runs after this job).
            ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"${MCPB_NAME}\") | .id")
            if [ -n "${ASSET_ID}" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
            fi
            UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.upload_url' | sed 's/{.*}//')
            gh api --method POST "${UPLOAD_URL}?name=${MCPB_NAME}" \
              --input "/tmp/${MCPB_NAME}" \
              -H "Content-Type: application/zip" > /dev/null
          done

  publish-release:
    name: Publish Release
    needs: [create-release, build-and-attest, generate-mcpb]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        # Publishing makes the release immutable (owner-enforced): assets and
        # the tag are locked from this point on. Only runs after every asset is
        # on the draft.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          IS_DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')
          if [ "${IS_DRAFT}" != "true" ]; then
            echo "Release already published"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false --jq '.html_url'; then
              exit 0
            fi
            echo "Publish attempt ${i} failed; retrying in 15s..."
            sleep 15
          done
          echo "Error: failed to publish release after 5 attempts" >&2
          exit 1

  update-homebrew:
    name: Update Homebrew Formula
    needs: [create-release, publish-release]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout homebrew-tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: clouatre-labs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${{ needs.create-release.outputs.version }}" \
            --repo clouatre-labs/aptu-coder \
            --pattern "*.tar.gz" \
            --dir /tmp/assets
          for f in /tmp/assets/*.tar.gz; do
            filename=$(basename "$f")
            sha256=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$filename:$sha256" >> /tmp/checksums.txt
          done

      - name: Update formula URLs and SHA256s
        run: |
          VERSION_NUMBER="${{ needs.create-release.outputs.version }}"
          RELEASE_TAG="v${VERSION_NUMBER}"

          declare -A shas
          while IFS=':' read -r filename sha; do
            shas["$filename"]="$sha"
          done < /tmp/checksums.txt

          SHA_MACOS_ARM="${shas["aptu-coder-${VERSION_NUMBER}-aarch64-apple-darwin.tar.gz"]}"
          SHA_LINUX_ARM="${shas["aptu-coder-${VERSION_NUMBER}-aarch64-unknown-linux-musl.tar.gz"]}"
          SHA_LINUX_X86="${shas["aptu-coder-${VERSION_NUMBER}-x86_64-unknown-linux-musl.tar.gz"]}"

          FORMULA="homebrew-tap/Formula/aptu-coder.rb"

          # Update URLs in-place; preserves all other formula content (service block, etc.)
          sed -i \
            -e "s|releases/download/v[0-9.]\+/aptu-coder-[0-9.]\+-aarch64-apple-darwin\.tar\.gz|releases/download/${RELEASE_TAG}/aptu-coder-${VERSION_NUMBER}-aarch64-apple-darwin.tar.gz|g" \
            -e "s|releases/download/v[0-9.]\+/aptu-coder-[0-9.]\+-aarch64-unknown-linux-musl\.tar\.gz|releases/download/${RELEASE_TAG}/aptu-coder-${VERSION_NUMBER}-aarch64-unknown-linux-musl.tar.gz|g" \
            -e "s|releases/download/v[0-9.]\+/aptu-coder-[0-9.]\+-x86_64-unknown-linux-musl\.tar\.gz|releases/download/${RELEASE_TAG}/aptu-coder-${VERSION_NUMBER}-x86_64-unknown-linux-musl.tar.gz|g" \
            "$FORMULA"

          # Update SHA256s: replace each sha256 line following its url line
          python3 - "$FORMULA" "$SHA_MACOS_ARM" "$SHA_LINUX_ARM" "$SHA_LINUX_X86" << 'PYEOF'
          import sys, re

          formula_path, sha_macos, sha_linux_arm, sha_linux_x86 = sys.argv[1:]

          sha_map = {
              "aarch64-apple-darwin": sha_macos,
              "aarch64-unknown-linux-musl": sha_linux_arm,
              "x86_64-unknown-linux-musl": sha_linux_x86,
          }

          with open(formula_path) as f:
              lines = f.readlines()

          out = []
          pending_sha = None
          for line in lines:
              if pending_sha is not None and re.match(r'\s+sha256 "', line):
                  out.append(re.sub(r'sha256 "[^"]*"', f'sha256 "{pending_sha}"', line))
                  pending_sha = None
                  continue
              pending_sha = None
              for arch, sha in sha_map.items():
                  if arch in line and "url " in line:
                      pending_sha = sha
                      break
              out.append(line)

          with open(formula_path, "w") as f:
              f.writelines(out)
          PYEOF

      - name: Create feature branch and commit formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd homebrew-tap
          RELEASE_TAG="v${{ needs.create-release.outputs.version }}"
          BRANCH_NAME="update-aptu-coder-${RELEASE_TAG}"

          git config user.email "hugues@linux.com"
          git config user.name "Hugues Clouatre"
          git fetch origin
          if git ls-remote --exit-code origin "$BRANCH_NAME" 2>/dev/null; then
            echo "Stale branch $BRANCH_NAME exists, deleting..."
            git push origin --delete "$BRANCH_NAME"
          fi
          git checkout -b "$BRANCH_NAME"
          git rm -f Formula/code-analyze-mcp.rb 2>/dev/null || true
          git add Formula/aptu-coder.rb
          git commit --signoff -m "Update aptu-coder formula for ${RELEASE_TAG}"
          git push origin "$BRANCH_NAME"

      - name: Create pull request with auto-merge
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd homebrew-tap
          RELEASE_TAG="v${{ needs.create-release.outputs.version }}"
          BRANCH_NAME="update-aptu-coder-${RELEASE_TAG}"

          gh pr create \
            --title "Update aptu-coder formula for ${RELEASE_TAG}" \
            --body "Automated formula update with SHA256 checksums for release ${RELEASE_TAG}" \
            --head "$BRANCH_NAME" \
            --base main

          # Auto-merge after Audit check passes (ruleset requires status checks)
          gh pr merge "$BRANCH_NAME" --auto --squash --delete-branch

  publish-registry:
    name: Publish to MCP Registry
    needs: [create-release, publish-release]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download MCPB files and compute SHA256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_TAG="v${{ needs.create-release.outputs.version }}"
          VERSION="${{ needs.create-release.outputs.version }}"

          declare -a targets=("aarch64-apple-darwin" "aarch64-unknown-linux-musl" "x86_64-unknown-linux-musl")
          declare -A shas

          for target in "${targets[@]}"; do
            MCPB_NAME="aptu-coder-${VERSION}-${target}.mcpb"
            DOWNLOAD_URL="https://github.com/clouatre-labs/aptu-coder/releases/download/${RELEASE_TAG}/${MCPB_NAME}"

            curl -fsSL "$DOWNLOAD_URL" -o "/tmp/${MCPB_NAME}"

            sha=$(sha256sum "/tmp/${MCPB_NAME}" | cut -d' ' -f1)
            shas["${target}"]="$sha"
          done

          # Write to environment for next step
          echo "SHA_AARCH64_APPLE_DARWIN=${shas[aarch64-apple-darwin]}" >> "$GITHUB_ENV"
          echo "SHA_AARCH64_LINUX_MUSL=${shas[aarch64-unknown-linux-musl]}" >> "$GITHUB_ENV"
          echo "SHA_X86_64_LINUX_MUSL=${shas[x86_64-unknown-linux-musl]}" >> "$GITHUB_ENV"

      - name: Build server.json from template
        run: |
          set -euo pipefail

          VERSION="${{ needs.create-release.outputs.version }}"

          jq \
            --arg version "$VERSION" \
            --arg sha_darwin "$SHA_AARCH64_APPLE_DARWIN" \
            --arg sha_linux_arm "$SHA_AARCH64_LINUX_MUSL" \
            --arg sha_linux_x86 "$SHA_X86_64_LINUX_MUSL" \
            '.version = $version |
             .packages = [
               {
                 "registryType": "mcpb",
                 "identifier": "https://github.com/clouatre-labs/aptu-coder/releases/download/v\($version)/aptu-coder-\($version)-aarch64-apple-darwin.mcpb",
                 "fileSha256": $sha_darwin,
                 "transport": {"type": "stdio"}
               },
               {
                 "registryType": "mcpb",
                 "identifier": "https://github.com/clouatre-labs/aptu-coder/releases/download/v\($version)/aptu-coder-\($version)-aarch64-unknown-linux-musl.mcpb",
                 "fileSha256": $sha_linux_arm,
                 "transport": {"type": "stdio"}
               },
               {
                 "registryType": "mcpb",
                 "identifier": "https://github.com/clouatre-labs/aptu-coder/releases/download/v\($version)/aptu-coder-\($version)-x86_64-unknown-linux-musl.mcpb",
                 "fileSha256": $sha_linux_x86,
                 "transport": {"type": "stdio"}
               }
             ]' \
            server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v1.7.8 \
            --repo modelcontextprotocol/registry \
            --pattern "mcp-publisher_linux_arm64.tar.gz" \
            --output /tmp/mcp-publisher.tar.gz
          echo "3eaa88ea0590433b538d3971a6ca0863d0345d3ff5937b0d1874b7a8de71a591  /tmp/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          test -f /tmp/mcp-publisher || { echo "mcp-publisher binary not found in tarball"; exit 1; }
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          rm -f /tmp/mcp-publisher.tar.gz

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish

  publish:
    name: Publish to crates.io
    needs: create-release
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"

      - name: Install cargo-release
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-release

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish workspace crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # PUBLISH_GRACE_SLEEP: documented cargo-release mechanism for inter-crate index
          # propagation delay (https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md).
          # Replaces hand-rolled curl-poll loops. 30s is conservative; crates.io typically
          # propagates within 10-15s but spikes under load.
          PUBLISH_GRACE_SLEEP: 30
        run: cargo release publish --execute --no-confirm

name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  scorecard:
    name: Scorecard Analysis
    # OpenSSF Scorecard only supports public repositories.
    # Skip on private/internal repos to avoid GITHUB_TOKEN GraphQL access errors.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Scorecard CLI
        env:
          VERSION: "5.5.0"
          SHA256: "3ce59d20c1d53e540c4a14e0da1e0d96b3b294e8ddc96a3c5a7b8a637b32991e"
        run: |
          curl -fsSL "https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_arm64.tar.gz" \
            -o scorecard.tar.gz
          echo "${SHA256}  scorecard.tar.gz" | sha256sum -c -
          tar -xzf scorecard.tar.gz

      - name: Run OpenSSF Scorecard
        env:
          ENABLE_SARIF: "1"
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scorecard --repo=github.com/${{ github.repository }} --format=sarif --show-details > results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        continue-on-error: true
        with:
          sarif_file: results.sarif

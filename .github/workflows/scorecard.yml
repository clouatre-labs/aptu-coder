# Golden reusable workflow (clouatre-labs/.github#103): OpenSSF Scorecard
# with the ossf/scorecard#5382 allow-list fallback built in.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  scorecard:
    uses: clouatre-labs/.github/.github/workflows/scorecard.yml@ac324c6e5fa4e63277256a8455049d56fc8afc38
    with:
      runner_label: ubuntu-26.04-arm
    permissions:
      contents: read
      id-token: write
      security-events: write
